[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbs-cli"
version = "0.6.1"
description = "Orbs - an automation framework for Web, Mobile (Appium), and API testing designed to grow with your team"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
  { name = "Muhamad Badru Salam", email = "badrusalam760@gmail.com" }
]
dependencies = [
  "typer[all]",
  "flask==2.2.5",
  "pyyaml==6.0",
  "apscheduler==3.10.1",
  "jinja2"==3.1.3,
  "requests==2.31.0",
  "python-dotenv==0.21.0",
  "Appium-Python-Client==2.8.1",
  "selenium==4.10.0",
  "behave==1.2.6",
  "reportlab==3.6.13",
  "InquirerPy==0.3.4",
  "mkdocs==1.5.0",
  "mkdocs-material==9.1.11"
]

[project.scripts]
orbs = "orbs.cli:app"

[project.urls]
Homepage = "https://github.com/badrusalam11/orbs-cli"
Repository = "https://github.com/badrusalam11/orbs-cli"
Issues = "https://github.com/badrusalam11/orbs-cli/issues"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
orbs = [
  "templates/**/*",
  "spy/js/*.js",
  "record/js/*.js"
]