# Browser Configuration
# Supported browsers: chrome, firefox, edge, safari

# Browser selection
browser=chrome

# Headless mode (true/false)
headless=false

# Private/Incognito mode (true/false)
# Automatically applies the correct flag for each browser:
#   Chrome  → --incognito
#   Firefox → private browsing preference
#   Edge    → --inprivate
private_mode=false

# Window size (widthxheight)
window_size=1920x1080

# Browser arguments (semicolon-separated, applied to selected browser automatically)
# Common args: --disable-gpu, --no-sandbox, --start-maximized, --disable-extensions
# Note: Framework will handle browser-specific compatibility automatically
args=

# WebDriver executable path (optional - leave empty for auto-detection)
driver_path=